spring:
  server:
    address: 0.0.0.0
    port: 8080
    forward-headers-strategy: framework
  profiles:
    active: dev
  data:
    redis:
      host: ${REDIS_HOST}
      port: 6379
  datasource:
    url: jdbc:mysql://${DB_SERVER}:${DB_PORT}/nyangDB?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&rewriteBatchedStatements=true
    username: ${DB_USER}
    password: ${DB_PASS}
  jpa:
    show-sql: false  # System.out 에 쿼리 출력 X (로깅을 통해 출력)
    properties:
      hibernate:
        format_sql: true          # SQL 예쁘게 출력
        highlight_sql: true       # SQL 컬러 출력 (Hibernate 6 이상)
        jdbc:
          batch_size: 100         # 배치 insert/update 시 유효
        order_inserts: true       # INSERT 순서 정렬
        order_updates: true       # UPDATE 순서 정렬


  jackson:
    serialization:
      WRITE_DATES_AS_TIMESTAMPS: false

  elasticsearch:
    uris: ${ELASTICSEARCH_URIS}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      group-id: search-log-group
      auto-offset-reset: earliest
    producer:
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      key-serializer: org.apache.kafka.common.serialization.StringSerializer

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - profile_nickname
            authorization-grant-type: authorization_code
          naver:
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - nickname
              - email
            authorization-grant-type: authorization_code
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - profile
              - email
            authorization-grant-type: authorization_code
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response
          google:
            #prompt=select_account 파라미터를 추가하면 계정 선택 화면을 띄울 수 있다.
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth?prompt=select_account
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub


  servlet:
    multipart:
      max-file-size: 10MB  # 업로드할 수 있는 개별 파일의 최대 크기. 기본 1MB
      max-request-size: 10MB  # multipart/form-data 요청의 최대 허용 크기. 기본 10MB
      enabled: true

  thymeleaf:
    cache: false

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SPRING_MAIL_USERNAME}
    password: ${SPRING_MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls.enable: true
          starttls.required: true

cloud:
  aws:
    credentials:
      access-key: ${AWS_ACCESS_KEY}
      secret-key: ${AWS_SECRET_KEY}
    region:
      static: ${AWS_REGION}  # 버킷의 리전
    s3:
      bucket: ${AWS_BUCKET}     # 버킷 이름
    stack:
      auto: false


jwt:
  secretKey: ${JWT_SECRET_KEY}
  accessTokenExpirationTime: 900000          # 15분 (밀리초 기준)
  refreshTokenExpirationTime: 1209600000     # 14일

publicapi:
  service-key: ${PUBLICAPI_SERVICE_KEY}

# prometheus
management:
  prometheus:
    metrics:
      export:
        enabled: true

  endpoints:
    web:
      exposure:
        include: "*"

  endpoint:
    health:
      show-details: always

  health:
    elasticsearch:
      enabled: false
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %highlight([%-3level]) %cyan(%logger{5}) - %msg%n"
  level:
    root: info
