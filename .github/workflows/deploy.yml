name: Simple Deploy to EC2

on:
  push:
    branches: [ feature/github-actions-deploy ]  # ✅ dev 브랜치에 push 시 동작

jobs:
  deploy:
    name: Build and Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Gradle
        run: |
          echo "Current working directory:"
          pwd
          cd server/nyang
          ./gradlew clean bootJar

      - name: Copy JAR to EC2
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          source: "server/nyang/build/libs/*.jar"
          target: "/home/ubuntu/togetnyang/"

      - name: Copy deploy.sh to EC2
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          source: "server/nyang/.github/scripts/deploy.sh"
          target: "/home/ubuntu/togetnyang/"

      - name: Run deploy script on EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          script: |
            chmod +x /home/ubuntu/togetnyang/deploy.sh
            /home/ubuntu/togetnyang/deploy.sh