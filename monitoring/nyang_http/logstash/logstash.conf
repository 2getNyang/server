input {
  file {
    path => "/logs/app.log"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    stat_interval => "1 second"
  }
}

filter {
  # 줄바꿈 문자 제거
  mutate {
    gsub => [
      "message", "[\r\n]+", ""
    ]
  }

  # 기본 로그 파싱
  grok {
    match => {
      "message" => "%{TIMESTAMP_ISO8601:timestamp} \[%{DATA:thread}\] \[%{LOGLEVEL:level}\s*\] %{JAVACLASS:logger} - %{GREEDYDATA:log_content}"
    }
  }

  # Request ID 추출 - message 필드에서 직접 추출
  grok {
    match => {
      "log_content" => "^\[(?<request_id>[0-9a-f]{8})\]"
    }
  }

  # Request ID가 있는 로그만 태그 추가
  if [request_id] {
    mutate {
      add_field => { "has_request_id" => "true" }
      add_tag => ["traced_request"]
    }
  }

  # OAuth2 로그 구분
  if "OAuth2_LOG" in [message] {
    mutate {
      add_field => { "log_type" => "OAuth2" }
    }
  }

  # 타임스탬프 변환
  date {
    match => ["timestamp", "yyyy-MM-dd HH:mm:ss.SSS"]
    timezone => "Asia/Seoul"
    target => "@timestamp"
  }
}

output {
  elasticsearch {
    hosts => ["http://nyang-elasticsearch:9200"]
    index => "spring-logs-%{+YYYY.MM.dd}"
  }
  stdout {
    codec => rubydebug
  }
}